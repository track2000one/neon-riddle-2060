    <radialGradient id="panel" cx="28%" cy="20%" r="92%"><stop offset="0" stop-color="#144c88"/><stop offset=".38" stop-color="#162d72"/><stop offset=".7" stop-color="#271260"/><stop offset="1" stop-color="#4b105b"/></radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efffff"/><stop offset=".48" stop-color="#fff"/><stop offset="1" stop-color="#ffd9fa"/></linearGradient>
