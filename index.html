<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07101f" />
  <meta name="robots" content="noindex,follow" />
  <title>NEON Academy 2060</title>
  <script>
    (() => {
      const target = new URL('academy/', window.location.href);
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.href);
    })();
  </script>
  <style>
    :root{font-family:Tahoma,"Segoe UI",Arial,sans-serif;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 15%,rgba(99,235,255,.16),transparent 28%),radial-gradient(circle at 82% 20%,rgba(164,110,255,.18),transparent 30%),linear-gradient(135deg,#050814,#0b1126 55%,#060916);color:#f7f9ff;padding:24px}
    main{width:min(520px,100%);padding:34px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(12,18,40,.84);box-shadow:0 25px 80px rgba(0,0,0,.42);text-align:center}
    .mark{width:74px;height:74px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#63ebff,#789eff,#a46eff);color:#07111b;font-size:34px;font-weight:900}
    h1{margin:0 0 10px;font-size:29px}
    p{margin:0 0 22px;color:#aab4d6;line-height:1.8}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:14px;background:linear-gradient(135deg,#63ebff,#789eff,#a46eff);color:#07111b;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <main>
    <div class="mark">N</div>
    <h1>يتم نقلك إلى NEON Academy 2060</h1>
    <p>أصبح الدخول المعتمد للمنصة من خلال الأكاديمية، ويتطلب إنشاء حساب أو تسجيل الدخول.</p>
    <a href="academy/">الدخول إلى المنصة</a>
  </main>
</body>
</html>
