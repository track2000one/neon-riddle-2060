name: Final Merge Gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-character PR HEAD SHA tested manually'
        required: true
        type: string
      manual_uat_approved:
        description: 'All required manual UAT cases completed successfully'
        required: true
        default: false
        type: boolean
      no_high_severity_regressions:
        description: 'No open Critical or High severity regressions'
        required: true
        default: false
        type: boolean
      signoff_owner:
        description: 'Name/identifier of the person approving manual UAT'
        required: true
        type: string
      uat_evidence:
        description: 'Optional ticket, notes, or evidence reference'
        required: false
        type: string

permissions:
  contents: read
  statuses: read
  pull-requests: read

jobs:
  final-merge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      NEON_MANUAL_UAT_APPROVED: ${{ inputs.manual_uat_approved }}
      NEON_NO_HIGH_SEVERITY_REGRESSIONS: ${{ inputs.no_high_severity_regressions }}
      NEON_SIGNOFF_OWNER: ${{ inputs.signoff_owner }}
      NEON_UAT_EVIDENCE: ${{ inputs.uat_evidence }}
    steps:
      - name: Validate approval inputs
        run: |
          test "${{ inputs.manual_uat_approved }}" = "true"
          test "${{ inputs.no_high_severity_regressions }}" = "true"
          echo "${{ inputs.candidate_sha }}" | grep -Eq '^[0-9a-fA-F]{40}$'
          test -n "${{ inputs.signoff_owner }}"

      - name: Verify candidate is current PR #1 HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/1")
          ACTUAL_HEAD=$(printf '%s' "$PR_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).head.sha))")
          test "$ACTUAL_HEAD" = "${{ inputs.candidate_sha }}"

      - name: Verify Railway Preview success on candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS_JSON=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${{ inputs.candidate_sha }}/status")
          RAILWAY_STATE=$(printf '%s' "$STATUS_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const x=(j.statuses||[]).find(v=>String(v.context||'').includes('neon-academy-frontend-preview'));process.stdout.write(String(x?.state||'missing'))})")
          echo "Railway state: $RAILWAY_STATE"
          test "$RAILWAY_STATE" = "success"
          echo "NEON_RAILWAY_STATUS=$RAILWAY_STATE" >> "$GITHUB_ENV"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run final RC gate
        run: npm run rc:final

      - name: Upload approved RC manifest
        uses: actions/upload-artifact@v4
        with:
          name: neon-approved-${{ inputs.candidate_sha }}
          path: artifacts/release-candidate-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish final approval summary
        run: |
          echo '## NEON Final Merge Gate' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Status: **APPROVED for Ready for Review**' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate SHA: \`${{ inputs.candidate_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual UAT sign-off: **${{ inputs.signoff_owner }}**" >> "$GITHUB_STEP_SUMMARY"
          echo 'Railway Preview: **Success on the same SHA**' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/release-candidate-manifest.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
