name: Final Merge Gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-character current PR #1 HEAD SHA'
        required: true
        type: string

permissions:
  actions: read
  contents: read
  statuses: read
  pull-requests: read

jobs:
  final-merge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEON_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Validate candidate SHA
        run: echo "$NEON_CANDIDATE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'

      - name: Verify candidate is current PR #1 HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/1")
          ACTUAL_HEAD=$(printf '%s' "$PR_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).head.sha))")
          echo "Current PR head: $ACTUAL_HEAD"
          test "$ACTUAL_HEAD" = "$NEON_CANDIDATE_SHA"

      - name: Verify Railway Preview success on candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS_JSON=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${NEON_CANDIDATE_SHA}/status")
          RAILWAY_STATE=$(printf '%s' "$STATUS_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const x=(j.statuses||[]).find(v=>String(v.context||'').includes('neon-academy-frontend-preview'));process.stdout.write(String(x?.state||'missing'))})")
          echo "Railway state: $RAILWAY_STATE"
          test "$RAILWAY_STATE" = "success"
          echo "NEON_RAILWAY_STATUS=$RAILWAY_STATE" >> "$GITHUB_ENV"

      - name: Locate successful Manual UAT Sign-off on candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS_JSON=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/manual-uat-signoff.yml/runs?event=workflow_dispatch&status=success&per_page=50")
          UAT_RUN_ID=$(printf '%s' "$RUNS_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const sha=process.env.NEON_CANDIDATE_SHA.toLowerCase();const x=(j.workflow_runs||[]).find(v=>String(v.head_sha||'').toLowerCase()===sha&&v.conclusion==='success');process.stdout.write(String(x?.id||''))})")
          test -n "$UAT_RUN_ID"
          echo "Manual UAT run: $UAT_RUN_ID"
          echo "NEON_UAT_RUN_ID=$UAT_RUN_ID" >> "$GITHUB_ENV"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$NEON_CANDIDATE_SHA"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Download Manual UAT sign-off artifact
        uses: actions/download-artifact@v4
        with:
          name: neon-manual-uat-${{ inputs.candidate_sha }}
          path: artifacts/manual-uat
          repository: ${{ github.repository }}
          run-id: ${{ env.NEON_UAT_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify Manual UAT sign-off artifact
        run: node scripts/verify-manual-uat-signoff.mjs artifacts/manual-uat/manual-uat-signoff.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run final RC gate
        run: npm run rc:final

      - name: Upload approved RC manifest
        uses: actions/upload-artifact@v4
        with:
          name: neon-approved-${{ inputs.candidate_sha }}
          path: artifacts/release-candidate-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish final approval summary
        run: |
          echo '## NEON Final Merge Gate' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Status: **APPROVED for Ready for Review**' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate SHA: \`$NEON_CANDIDATE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual UAT run: **$NEON_UAT_RUN_ID**" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual UAT tester: **$NEON_SIGNOFF_OWNER**" >> "$GITHUB_STEP_SUMMARY"
          echo 'Manual UAT cases: **15/15 PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo 'Railway Preview: **Success on the same SHA**' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/release-candidate-manifest.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
