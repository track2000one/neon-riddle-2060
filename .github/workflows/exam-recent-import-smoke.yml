name: Recent exam import smoke test

on:
  push:
    branches: [main]
    paths:
      - 'academy/auth-guard.js'
      - 'academy/center-page.js'
      - 'academy/recent-exam-import-repair.js'
      - 'academy/exam-bank-tahsili-chemistry-1.js'
      - 'academy/exam-bank-tahsili-chemistry-2.js'
      - 'academy/exam-bank-imported-2026.js'
      - 'academy/exam-bank-uploaded-pdf-qqtahsili-00004-chemistry-2026.js'
      - 'academy/tests/exam-recent-import-smoke.cjs'
      - 'academy/tests/exam-center-loader-audit.cjs'
      - '.github/workflows/exam-recent-import-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check academy/exam-bank-imported-2026.js
          node --check academy/exam-bank-uploaded-pdf-qqtahsili-00004-chemistry-2026.js
          node --check academy/recent-exam-import-repair.js
          node --check academy/center-page.js
          node --input-type=module --check < academy/auth-guard.js
      - name: Verify main academy loader includes recent bank
        run: |
          grep -q "exam-bank-uploaded-pdf-qqtahsili-00004-chemistry-2026.js" academy/auth-guard.js
          grep -q "recent-exam-import-repair.js" academy/auth-guard.js
          grep -q "versioned(src)" academy/auth-guard.js
      - name: Verify recent imports
        run: node academy/tests/exam-recent-import-smoke.cjs
      - name: Audit standalone exam center loader
        run: node academy/tests/exam-center-loader-audit.cjs
