name: Exam platform integrity audit

on:
  push:
    branches: [main]
    paths:
      - 'academy/**'
      - '.github/workflows/exam-recent-import-smoke.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check academy JavaScript syntax
        run: |
          for file in academy/*.js; do
            if grep -Eq '^[[:space:]]*import[[:space:]]' "$file"; then
              node --input-type=module --check < "$file"
            else
              node --check "$file"
            fi
          done
          for file in academy/tests/*.cjs; do node --check "$file"; done
      - name: Verify canonical manifest wiring
        run: |
          grep -q "NEON_EXAM_DATA_ASSETS" academy/auth-guard.js
          grep -q "NEON_EXAM_DATA_ASSETS" academy/center-page.js
          grep -q "exam-center-shell-reset.js" academy/exam-assets-manifest.js
          grep -q "exam-center-runtime-fix.js" academy/exam-assets-manifest.js
          grep -q "exam-bank-uploaded-pdf-qqtahsili-00004-chemistry-2026.js" academy/exam-assets-manifest.js
          grep -q "exam-bank-uploaded-zip8887777-20260808-5.js" academy/exam-assets-manifest.js
          grep -q "cache:'no-store'" academy/center-page.js
          grep -q "neonAcademyCenterShellV4" academy/center-page.js
          grep -q "20260817-2030-r2" academy/exam-assets-manifest.js
          grep -q "20260817-2030-r2" academy/exams.html
          grep -q "20260817-2030-r2" academy/exam-center.html
      - name: Verify recent imports
        run: node academy/tests/exam-recent-import-smoke.cjs
      - name: Audit canonical exam loader
        run: node academy/tests/exam-center-loader-audit.cjs
      - name: Full exam platform integrity audit
        run: node academy/tests/platform-exam-integrity-audit.cjs
