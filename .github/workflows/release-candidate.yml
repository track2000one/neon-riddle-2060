name: Release Candidate Preparation

on:
  push:
    branches:
      - performance-vite
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'server/**'
      - 'scripts/**'
      - 'academy/**'
      - 'release/**'
      - 'docs/**'
      - 'package.json'
      - 'vite.config.js'
      - 'railway.toml'
      - '.github/workflows/release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and prepare release candidate
        run: npm run rc:prepare

      - name: Upload immutable RC manifest
        uses: actions/upload-artifact@v4
        with:
          name: neon-rc-${{ github.sha }}
          path: artifacts/release-candidate-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish RC summary
        run: |
          echo '## NEON Release Candidate' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Status: **PREPARED — manual UAT still required**' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/release-candidate-manifest.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
