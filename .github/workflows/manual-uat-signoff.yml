name: Manual UAT Sign-off

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact current PR #1 HEAD SHA tested manually'
        required: true
        type: string
      tester:
        description: 'Name/identifier of the person who executed Manual UAT'
        required: true
        type: string
      uat_results_json:
        description: 'JSON object: all 15 required case IDs must equal PASS'
        required: true
        type: string
      no_high_severity_regressions:
        description: 'Confirm zero open Critical/High regressions'
        required: true
        default: false
        type: boolean
      evidence:
        description: 'Evidence/notes reference for the executed Manual UAT'
        required: true
        type: string

permissions:
  contents: read
  statuses: read
  pull-requests: read

jobs:
  manual-uat-signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEON_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      NEON_UAT_TESTER: ${{ inputs.tester }}
      NEON_UAT_RESULTS_JSON: ${{ inputs.uat_results_json }}
      NEON_NO_HIGH_SEVERITY_REGRESSIONS: ${{ inputs.no_high_severity_regressions }}
      NEON_UAT_EVIDENCE: ${{ inputs.evidence }}
    steps:
      - name: Validate candidate input
        run: |
          echo "$NEON_CANDIDATE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          test -n "$NEON_UAT_TESTER"
          test -n "$NEON_UAT_EVIDENCE"
          test "$NEON_NO_HIGH_SEVERITY_REGRESSIONS" = "true"

      - name: Verify candidate is current PR #1 HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/1")
          ACTUAL_HEAD=$(printf '%s' "$PR_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).head.sha))")
          echo "Current PR head: $ACTUAL_HEAD"
          test "$ACTUAL_HEAD" = "$NEON_CANDIDATE_SHA"

      - name: Verify Railway Preview success on candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS_JSON=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${NEON_CANDIDATE_SHA}/status")
          RAILWAY_STATE=$(printf '%s' "$STATUS_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const x=(j.statuses||[]).find(v=>String(v.context||'').includes('neon-academy-frontend-preview'));process.stdout.write(String(x?.state||'missing'))})")
          echo "Railway state: $RAILWAY_STATE"
          test "$RAILWAY_STATE" = "success"
          echo "NEON_RAILWAY_STATUS=$RAILWAY_STATE" >> "$GITHUB_ENV"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Confirm exact checkout
        run: test "$(git rev-parse HEAD)" = "$NEON_CANDIDATE_SHA"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Create signed Manual UAT record
        run: node scripts/create-manual-uat-signoff.mjs

      - name: Upload Manual UAT sign-off artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-manual-uat-${{ inputs.candidate_sha }}
          path: artifacts/manual-uat-signoff.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish Manual UAT summary
        run: |
          echo '## NEON Manual UAT Sign-off' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Status: **APPROVED — 15/15 Manual UAT cases PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate SHA: \`$NEON_CANDIDATE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Tester: **$NEON_UAT_TESTER**" >> "$GITHUB_STEP_SUMMARY"
          echo 'Railway Preview: **Success on the same SHA**' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/manual-uat-signoff.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
