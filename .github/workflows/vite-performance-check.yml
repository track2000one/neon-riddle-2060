name: Vite Performance Build

on:
  push:
    branches:
      - performance-vite
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'vercel.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vite preview
        run: npm run build

      - name: Validate output entries
        run: |
          test -f dist/index.html
          test -f dist/step.html
          test -d dist/assets
          test -d dist/legacy
          echo "Vite output validated successfully."
