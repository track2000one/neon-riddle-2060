<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Atari 2600 Player</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,sans-serif}
    #game{width:100%;height:100%;min-height:100%;background:#000}
    #waiting{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 45%,rgba(63,220,255,.08),transparent 35%),#010204;color:#8fa5bf}
    #waiting b{display:block;color:#72e9ff;font:900 48px/1 ui-monospace,Consolas,monospace;text-shadow:0 0 24px rgba(114,233,255,.4)}
    #waiting small{display:block;margin-top:10px}
    body.running #waiting{display:none}
  </style>
</head>
<body>
  <div id="waiting"><div><b>2600</b><small>Waiting for local ROM…</small></div></div>
  <div id="game"></div>
  <script type="module" src="/src/atari-2600-player.js"></script>
</body>
</html>
